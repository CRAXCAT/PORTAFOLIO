<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Acceso Admin | Portfolio</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="auth-body">
<div class="noise"></div>
<a href="index.html" class="back-link">← Volver al Portfolio</a>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-icon">🔐</div>
      <h2 class="auth-title">Área de Administración</h2>
      <p class="auth-sub">Acceso exclusivo para el administrador del portfolio</p>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="login">Iniciar sesión</button>
      <button class="tab" data-tab="register">Registrarse</button>
    </div>

    <div class="tab-pane active" id="pane-login">
      <div class="field"><label>Correo electrónico</label>
        <input type="email" id="l-email" placeholder="correo@ejemplo.com"/></div>
      <div class="field"><label>Contraseña</label>
        <input type="password" id="l-pass" placeholder="••••••••"/></div>
      <div class="msg error" id="l-err" style="display:none"></div>
      <button class="btn-primary full" id="btn-login">Iniciar sesión</button>
    </div>

    <div class="tab-pane" id="pane-register">
      <div class="field"><label>Nombre completo</label>
        <input type="text" id="r-name" placeholder="Tu nombre completo"/></div>
      <div class="field"><label>Correo electrónico</label>
        <input type="email" id="r-email" placeholder="correo@ejemplo.com"/></div>
      <div class="field"><label>Contraseña</label>
        <input type="password" id="r-pass" placeholder="Mínimo 6 caracteres"/></div>
      <div class="msg error" id="r-err" style="display:none"></div>
      <div class="msg success" id="r-ok" style="display:none"></div>
      <button class="btn-primary full" id="btn-register">Crear cuenta</button>
      <p class="note">Las cuentas nuevas tienen rol <strong>user</strong> por defecto.</p>
    </div>
  </div>
</div>

<script src="js/supabase-config.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
