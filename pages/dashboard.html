<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard Admin | Portfolio</title>
  <link rel="stylesheet" href="../css/style.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="dash-body">
<div class="noise"></div>
<div class="side-overlay" id="overlay"></div>

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">
  <div class="sb-logo">📐 <span>Portfolio</span></div>
  <div class="sb-user" id="sb-user">
    <div class="sb-avatar" id="sb-avatar">K</div>
    <div><div class="sb-name" id="sb-name">...</div>
    <div class="sb-role" id="sb-role">user</div></div>
  </div>
  <nav class="sb-nav">
    <a href="../index.html" class="sb-link">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Ver Portfolio
    </a>
    <a href="#" class="sb-link active" data-v="overview">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      Resumen
    </a>
    <a href="#" class="sb-link admin-item" data-v="manage" style="display:none">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      Gestionar
    </a>
    <a href="#" class="sb-link admin-item" data-v="users" style="display:none">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      Usuarios
    </a>
  </nav>
  <button class="sb-logout" id="btn-logout">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    Cerrar sesión
  </button>
</aside>

<!-- MAIN -->
<div class="dash-main">
  <header class="dash-top">
    <button class="menu-btn" id="menu-btn">☰</button>
    <h1 class="dash-title" id="dash-title">Resumen</h1>
    <span class="live-badge">● En línea</span>
  </header>

  <!-- OVERVIEW -->
  <div class="dview active" id="dv-overview">
    <div class="overview-stats" id="ov-stats">
      <div class="loading-center"><div class="spinner"></div></div>
    </div>
    <div class="overview-units" id="ov-units">
      <div class="loading-center"><div class="spinner"></div></div>
    </div>
  </div>

  <!-- MANAGE -->
  <div class="dview" id="dv-manage">
    <!-- Nueva Unidad -->
    <div class="admin-card">
      <div class="admin-card-header">
        <span class="admin-card-icon">📁</span>
        <h3>Nueva Unidad</h3>
      </div>
      <div class="form-grid3">
        <div class="field"><label>Número</label><input type="number" id="u-num" placeholder="1" min="1" max="4"/></div>
        <div class="field"><label>Nombre</label><input type="text" id="u-name" placeholder="Unidad 1 — Fundamentos"/></div>
        <div class="field"><label>Descripción</label><input type="text" id="u-desc" placeholder="Descripción breve"/></div>
      </div>
      <button class="btn-primary" id="btn-add-unit">Crear Unidad</button>
      <div class="msg" id="u-msg" style="display:none"></div>
    </div>

    <!-- Nueva Semana -->
    <div class="admin-card">
      <div class="admin-card-header">
        <span class="admin-card-icon">📅</span>
        <h3>Nueva Semana</h3>
      </div>
      <div class="form-grid3">
        <div class="field"><label>Unidad</label>
          <select id="w-unit"><option value="">Selecciona una unidad...</option></select></div>
        <div class="field"><label>Número de Semana</label>
          <input type="number" id="w-num" placeholder="1" min="1"/></div>
        <div class="field"><label>Título</label>
          <input type="text" id="w-title" placeholder="Título de la semana"/></div>
      </div>
      <div class="field"><label>Descripción / Contenido</label>
        <textarea id="w-desc" rows="3" placeholder="Describe el contenido de esta semana..."></textarea></div>
      <div class="form-grid2">
        <div class="field"><label>Imagen de portada (opcional)</label>
          <input type="file" id="w-img" accept="image/*" class="file-input"/>
          <div id="img-prev" class="img-prev"></div></div>
        <div class="field"><label>Archivos adjuntos (PDF, Word, PPT, etc.) — puedes subir varios</label>
          <input type="file" id="w-files" multiple accept=".pdf,.doc,.docx,.ppt,.pptx,.txt,.zip,.xlsx,.xls" class="file-input"/>
          <div id="files-tags" class="files-tags"></div></div>
      </div>
      <button class="btn-primary" id="btn-add-week"><span>Publicar Semana</span></button>
      <div class="progress-wrap" id="prog-wrap" style="display:none">
        <div class="prog-bar"><div class="prog-fill" id="prog-fill"></div></div>
        <span id="prog-text" class="prog-text">Subiendo...</span>
      </div>
      <div class="msg" id="w-msg" style="display:none"></div>
    </div>

    <!-- Lista de contenido -->
    <div class="admin-card">
      <div class="admin-card-header">
        <span class="admin-card-icon">📋</span>
        <h3>Contenido publicado</h3>
      </div>
      <div id="content-list"><div class="loading-center"><div class="spinner"></div></div></div>
    </div>
  </div>

  <!-- USERS -->
  <div class="dview" id="dv-users">
    <div class="admin-card">
      <div class="admin-card-header">
        <span class="admin-card-icon">👥</span>
        <h3>Usuarios registrados</h3>
      </div>
      <div id="users-wrap"><div class="loading-center"><div class="spinner"></div></div></div>
    </div>
  </div>
</div>

<script src="../js/supabase-config.js"></script>
<script src="../js/dashboard.js"></script>
</body>
</html>
